<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آفاق اليسر · التجهيز</title>
<meta name="theme-color" content="#14110b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="تجهيز آفاق">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="staff.webmanifest">
<style>
:root{--bg:#f5efe2;--card:#fffdf7;--tx:#1d1a12;--mu:#7d725c;--ac:#b8892b;--ln:#e7d9b5;--ok:#1e8449;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#110f0a;--card:#1c1912;--tx:#f4ecd8;--mu:#a99d82;--ac:#d9aa43;--ln:#3a3220;color-scheme:dark}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;background:linear-gradient(180deg,#14110b,#2b2415);border-bottom:3px solid #c9a24b;color:#e6c274}
header img{height:44px}header b{font-size:19px;display:block}header small{color:#d3c7a6;font-size:12px}header #who{margin-inline-start:auto;font-size:13px;color:#d3c7a6}
nav{display:flex;gap:6px;padding:10px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:12px 6px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-weight:700;font-size:15px}
nav button.on{background:#17140d;color:#e6c274;border-color:#c9a24b}nav button.s{flex:0 0 52px}
main{padding:0 12px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{padding:12px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#e6c274,#b8892b);color:#1a1405;font:inherit;font-weight:800;font-size:15px}
.btn.g{background:none;color:var(--ac);border:1px solid var(--ac)}.btn.ok{background:var(--ok);color:#fff}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin-bottom:10px}
.job{display:flex;align-items:center;gap:10px;cursor:pointer}.job .pr{flex:0 0 auto;font-weight:800;font-size:18px}
.bar{height:8px;background:var(--ln);border-radius:6px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.it{display:flex;align-items:center;gap:12px;padding:12px;border:2px solid var(--ln);border-radius:14px;margin-bottom:10px;background:var(--card);cursor:pointer;user-select:none}
.it img{width:86px;height:68px;object-fit:contain;background:#efe9da;border-radius:10px;flex:0 0 auto}.it .t{flex:1}.it .q{font-size:22px;font-weight:900}
.it .ck{flex:0 0 52px;height:52px;border-radius:50%;border:3px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:30px;color:transparent}
.it.done{border-color:var(--ok);background:rgba(30,132,73,.1)}.it.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}.it.done .t b{text-decoration:line-through;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow:hidden}.pc.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.pc img{width:100%;height:110px;object-fit:contain;background:#efe9da;display:block}.pc .n{padding:6px 8px;font-size:13px;min-height:38px}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 8px 8px}.st input{flex:1;min-width:50px}.st .cb{flex:1 1 100%;width:auto!important;height:36px!important;border-radius:10px!important;font-size:14px!important}.st button{width:40px;height:40px;border-radius:50%;border:1px solid var(--ac);background:none;color:var(--ac);font-size:22px}.st input{margin:0;text-align:center;font-weight:800;padding:6px}
.st small{flex:0 0 100%;font-size:11px;color:var(--mu);text-align:center}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(201,162,75,.2)}
.empty{color:var(--mu);text-align:center;padding:30px}
#tst{display:none;position:fixed;top:70px;left:12px;right:12px;background:#333;color:#fff;padding:12px;border-radius:12px;z-index:60;text-align:center}
.foot{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px}
</style>
</head>

async function upd(p,fn){for(var i=0;i<4;i++){var f=await getF(p);if(!f)throw 404;fn(f.data);try{var sha=await putF(p,f.data,f.sha,"تجهيز");return {sha:sha,data:f.data}}catch(e){if(e!=409&&e!=422)throw e}}throw 409}
async function list(dir){var r=await api("GET",dir);if(r.status==404)return [];if(!r.ok)throw r.status;return (await r.json()).filter(function(x){return /\.json$/.test(x.name)})}
async function sync(force){if(!CFG.t||BUSY)return;BUSY=1;try{var L=await list("jobs"),N={};for(var i=0;i<L.length;i++){var f=L[i],k=f.name.replace(".json","");N[k]=1;if(!J[k]||J[k].sha!=f.sha){var g=await getF("jobs/"+f.name);if(g)J[k]={sha:g.sha,data:g.data}}}
  Object.keys(J).forEach(function(k){if(!N[k])delete J[k]});
  var Q=await list("requests"),M={};for(var i=0;i<Q.length;i++){var q=Q[i],k=q.name.replace(".json","");M[k]=1;if(!R[k]||R[k].sha!=q.sha){var h=await getF("requests/"+q.name);if(h)R[k]={sha:h.sha,data:h.data}}}
  Object.keys(R).forEach(function(k){if(!M[k])delete R[k]});
  localStorage.setItem("stf_j",JSON.stringify(J));localStorage.setItem("stf_r",JSON.stringify(R));LAST=Date.now();render(1)}
 catch(e){if(e==401||e==403)msg("رمز الربط غير صالح — راجع ⚙");else if(e==404)msg("ما لكيت مستودع البيانات — راجع ⚙");else msg("تعذر الاتصال، يعيد المحاولة...")}BUSY=0}
function prog(d){var n=d.rows.length,k=d.rows.filter(function(r){return d.st&&d.st[r.id]&&d.st[r.id].ok}).length;return {n:n,k:k}}
function go(v){V=v;CUR=null;["n1","n2","n3"].forEach(function(i,j){$(i).classList.toggle("on",["jobs","req","set"][j]==v)});render();window.scrollTo(0,0)}
function render(bg){instUI();$("who").textContent=CFG.name?"👤 "+CFG.name:"";var open=Object.keys(J).map(function(k){return J[k].data}).filter(function(d){var p=prog(d);return p.k<p.n&&!d.closed}).length;$("cj").textContent=open?"("+open+")":"";
 if(!CFG.t||!CFG.name){if(V!="set"){V="set";["n1","n2","n3"].forEach(function(i,j){$(i).classList.toggle("on",j==2)})}}
 if(bg&&(V=="req"||V=="set"))return;var h="";
 if(V=="set")h=vSet();else if(V=="jobs")h=CUR?vJob(CUR):vJobs();else if(V=="req")h=vReq();$("m").innerHTML=h;if(V=="req")rqUpd()}
function vSet(){return '<div class="card"><b>ربط الجهاز</b><p style="font-size:13px;color:var(--mu)">اكتب اسمك، والصق «رمز الربط» الذي وصلك من المدير بواتساب.</p><input id="snm" placeholder="اسمك (مثال: علي)" value="'+E(CFG.name||"")+'"><textarea id="skey" rows="3" placeholder="الصق رمز الربط هنا" dir="ltr">'+(CFG.t?"✔ مربوط":"")+'</textarea><button class="btn" style="width:100%" onclick="saveSet()">حفظ</button>'+
 (CFG.t?'<p style="font-size:12px;color:var(--mu)">آخر تحديث: '+(LAST?new Date(LAST).toLocaleTimeString("ar-IQ"):"—")+'</p><button class="btn g" style="width:100%" onclick="sync(1)">🔄 تحديث الآن</button>':"")+'</div><p style="font-size:12px;color:var(--mu);text-align:center">المنتجات: '+SEED.length+'</p>'}
function saveSet(){var n=$("snm").value.trim(),k=$("skey").value.trim();if(!n){msg("اكتب اسمك");return}CFG.name=n;
 if(k&&k.indexOf("✔")<0){try{var m=k.match(/k=([^\s&]+)/),x=JSON.parse(dec(decodeURIComponent(m?m[1]:k)));CFG.o=x.o;CFG.r=x.r;CFG.t=x.t}catch(e){msg("رمز الربط غير صحيح");return}}
 if(!CFG.t){msg("الصق رمز الربط");return}localStorage.setItem("stf_cfg",JSON.stringify(CFG));iosKeep();msg("تم الحفظ ✅");go("jobs");sync(1)}
function vJobs(){var L=Object.keys(J).map(function(k){return J[k].data}).sort(function(a,b){return (b.at||0)-(a.at||0)}),O=L.filter(function(d){var p=prog(d);return p.k<p.n&&!d.closed}),D=L.filter(function(d){var p=prog(d);return !(p.k<p.n&&!d.closed)}).slice(0,15);
 var card=function(d){var p=prog(d);return '<div class="card job" onclick="CUR=\''+d.no+'\';render();window.scrollTo(0,0)"><div style="flex:1"><b>فاتورة '+E(d.no)+'</b> · '+E(d.cust||"بدون اسم")+'<br><small style="color:var(--mu)">'+E(d.whn||"")+' · '+new Date(d.at||0).toLocaleString("ar-IQ")+'</small>'+(d.nt?'<br><small>📝 '+E(d.nt)+'</small>':"")+'<div class="bar"><i style="width:'+(p.n?100*p.k/p.n:0)+'%"></i></div></div><div class="pr" style="color:'+(p.k==p.n?"var(--ok)":"var(--tx)")+'">'+p.k+'/'+p.n+'</div></div>'};
 return '<div style="display:flex;justify-content:space-between;align-items:center;margin:4px 0 8px"><b>للتجهيز ('+O.length+')</b><button class="btn g" style="padding:8px 12px" onclick="sync(1)">🔄</button></div>'+(O.length?O.map(card).join(""):'<div class="empty">ماكو فواتير للتجهيز 👌</div>')+(D.length?'<h3>منتهية</h3>'+D.map(card).join(""):"")}
function vJob(no){var x=J[no];if(!x)return '<div class="empty">الفاتورة انحذفت</div>';var d=x.data,p=prog(d);
 return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:18px">فاتورة '+E(d.no)+'</b><br>'+E(d.cust||"")+' · '+E(d.whn||"")+'</div><div class="pr" style="font-size:22px;font-weight:900;color:'+(p.k==p.n?"var(--ok)":"var(--tx)")+'">'+p.k+'/'+p.n+'</div></div>'+(d.nt?'<div style="margin-top:6px">📝 '+E(d.nt)+'</div>':"")+'<div class="bar"><i style="width:'+(p.n?100*p.k/p.n:0)+'%"></i></div></div>'+
 d.rows.map(function(r){var pr=P(r.id),s=d.st&&d.st[r.id];return '<div class="it'+(s&&s.ok?" done":"")+'" onclick="tick(\''+E(d.no)+'\',\''+E(r.id)+'\')"><img src="'+(pr?pr.img:"")+'" alt=""><div class="t"><b>'+E(r.n)+'</b><div class="q">'+E(QF(r.c,r.u,r.ctn,r.u2))+'</div>'+(s&&s.ok?'<small style="color:var(--ok)">✓ '+E(s.by||"")+' · '+new Date(s.at).toLocaleTimeString("ar-IQ",{hour:"2-digit",minute:"2-digit"})+'</small>':"")+'</div><div class="ck">✓</div></div>'}).join("")+
 '<div class="foot"><button class="btn g" onclick="CUR=null;render()">→ رجوع</button><button class="btn ok" style="flex:1" onclick="tickAll(\''+E(d.no)+'\')">✓ تم تجهيز الكل</button></div>'}
async function tick(no,id){var x=J[no];if(!x)return;var d=x.data;d.st=d.st||{};var now=!(d.st[id]&&d.st[id].ok);d.st[id]=now?{ok:1,by:CFG.name,at:Date.now()}:{ok:0,by:CFG.name,at:Date.now()};render();
 try{var r=await upd("jobs/"+no+".json",function(f){f.st=f.st||{};f.st[id]=d.st[id];f.upd=Date.now()});J[no]={sha:r.sha,data:r.data};localStorage.setItem("stf_j",JSON.stringify(J));render()}catch(e){msg("ما انحفظ، تأكد من الإنترنت");sync(1)}}
async function tickAll(no){var x=J[no];if(!x)return;var d=x.data;d.st=d.st||{};var t=Date.now();d.rows.forEach(function(r){if(!(d.st[r.id]&&d.st[r.id].ok))d.st[r.id]={ok:1,by:CFG.name,at:t}});render();
 try{var r=await upd("jobs/"+no+".json",function(f){f.st=f.st||{};f.rows.forEach(function(rr){if(!(f.st[rr.id]&&f.st[rr.id].ok))f.st[rr.id]={ok:1,by:CFG.name,at:t}});f.upd=t});J[no]={sha:r.sha,data:r.data};localStorage.setItem("stf_j",JSON.stringify(J));msg("✅ تم تجهيز الفاتورة "+no);CUR=null;render()}catch(e){msg("ما انحفظ، تأكد من الإنترنت");sync(1)}}
/* طلب تجهيز جديد مع الزبون */
var RQS="";function vReq(){var mine=Object.keys(R).map(function(k){return R[k].data}).filter(function(d){return d.by==CFG.name}).sort(function(a,b){return b.at-a.at}).slice(0,10);
 return '<div class="card"><b>طلب تجهيز جديد</b><input id="rqc" placeholder="اسم الزبون" value="'+E(RQ.cust||"")+'" oninput="RQ.cust=this.value"><textarea id="rqn" rows="2" placeholder="ملاحظات (اختياري)" oninput="RQ.nt=this.value">'+E(RQ.nt||"")+'</textarea></div>'+
 '<input id="rqs" placeholder="🔍 ابحث عن منتج" value="'+E(RQS)+'" oninput="RQS=this.value;rqGrid()"><div class="grid" id="rqg"></div>'+
 '<div class="foot"><span id="rqsum" style="flex:1;align-self:center;font-weight:700"></span><button class="btn" onclick="rqSend()">📤 إرسال الطلب</button></div>'+
 (mine.length?'<h3>طلباتي</h3>'+mine.map(function(d){return '<div class="card"><b>'+E(d.cust||"بدون اسم")+'</b> · '+d.rows.length+' صنف <span class="tag">'+(d.status=="done"?"✅ صارت فاتورة "+E(d.inv||""):d.status=="rejected"?"❌ مرفوض":"⏳ بانتظار المدير")+'</span><br><small style="color:var(--mu)">'+new Date(d.at).toLocaleString("ar-IQ")+'</small></div>'}).join(""):"")}
function rqGrid(){var g=$("rqg");if(!g)return;RQ.q=RQ.q||{};var s=(RQS||"").trim();g.innerHTML=SEED.filter(function(p){return !s||p.n.indexOf(s)>=0}).map(function(p){var q=RQ.q[p.id]||0;
 return '<div class="pc'+(q?" sel":"")+'"><img src="'+p.img+'" alt=""><div class="n">'+E(p.n)+(p.unit?' <small style="color:var(--mu)">· '+E(p.unit)+'</small>':"")+'</div><div class="st"><button onclick="rqCh(\''+p.id+'\',-1)">−</button><input type="number" inputmode="numeric" value="'+q+'" onchange="rqSet(\''+p.id+'\',this.value)"><button onclick="rqCh(\''+p.id+'\',1)">+</button>'+(p.ctn>1?'<small>'+(q>=p.ctn?QF(q,p.unit,p.ctn,p.u2):"")+'</small><button class="cb" onclick="rqCh(\''+p.id+'\','+p.ctn+',1)">+ '+E(p.u2||"كارتون")+'</button>':"")+'</div></div>'}).join("")||'<div class="empty">ماكو منتجات</div>';rqUpd()}
function rqCh(id,d,raw){var p=P(id),st=raw?1:(p&&p.step)||1;RQ.q=RQ.q||{};RQ.q[id]=Math.max(0,(RQ.q[id]||0)+d*st);if(!RQ.q[id])delete RQ.q[id];rqGrid()}
function rqSet(id,v){RQ.q=RQ.q||{};var n=Math.max(0,parseInt(v)||0);if(n)RQ.q[id]=n;else delete RQ.q[id];rqGrid()}
function rqUpd(){var e=$("rqsum");if(!e)return;var k=Object.keys(RQ.q||{});e.textContent=k.length?k.length+" صنف":"";if(!$("rqg").innerHTML)rqGrid()}
async function rqSend(){var k=Object.keys(RQ.q||{});if(!k.length){msg("اختار منتجات أول");return}if(!(RQ.cust||"").trim()){msg("اكتب اسم الزبون");return}
 var id=Date.now().toString(36)+Math.random().toString(36).slice(2,6),d={id:id,by:CFG.name,at:Date.now(),cust:RQ.cust.trim(),nt:(RQ.nt||"").trim(),status:"new",rows:k.map(function(i){var p=P(i);return {id:i,n:p?p.n:i,c:RQ.q[i],u:p?p.unit||"":""}})};
 try{var sha=await putF("requests/"+id+".json",d,null,"طلب تجهيز");R[id]={sha:sha,data:d};localStorage.setItem("stf_r",JSON.stringify(R));RQ={};RQS="";msg("✅ انرسل الطلب للمدير");render()}catch(e){msg(e==401||e==403?"رمز الربط ما يسمح بالكتابة":"ما انرسل، تأكد من الإنترنت")}}

/* تنزيل التطبيق على الشاشة */
var SA=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true,IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform=="MacIntel"&&navigator.maxTouchPoints>1),DP=null;
if("serviceWorker" in navigator&&(location.protocol=="https:"||location.hostname=="localhost"))navigator.serviceWorker.register("sw.js").catch(function(){});
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();DP=e;instUI()});window.addEventListener("appinstalled",function(){DP=null;SA=true;instUI();msg("✅ تنزّل التطبيق على الشاشة")});
function iosKeep(){if(!IOS||SA||!CFG.t)return;var l=document.querySelector('link[rel=manifest]');if(l)l.remove();var k=enc(JSON.stringify({o:CFG.o,r:CFG.r,t:CFG.t}));history.replaceState(null,"",location.pathname+"#k="+encodeURIComponent(k)+(CFG.name?"&n="+encodeURIComponent(CFG.name):""))}
function instHTML(){if(SA)return "";if(DP)return '<div class="card" style="border:2px solid #c9a24b;background:rgba(201,162,75,.15)"><b>📲 نزّل تطبيق التجهيز على الشاشة</b><br><small>حتى تفتحه بضغطة وتوصلك الفواتير بسرعة.</small><button class="btn" style="width:100%;margin-top:8px" onclick="instGo()">📲 تنزيل التطبيق</button></div>';
 if(IOS)return '<div class="card" style="border:2px solid #c9a24b;background:rgba(201,162,75,.15)"><b>📲 نزّل التطبيق على الشاشة:</b><br>1) اضغط زر المشاركة <b>⬆️</b> بسفاري<br>2) اختر <b>«إضافة إلى الشاشة الرئيسية»</b> ثم <b>«إضافة»</b><br><small>إذا فاتح من واتساب، افتحه بسفاري أول.</small></div>';
 return '<div class="card" style="border:2px solid #c9a24b;background:rgba(201,162,75,.15)"><b>📲 نزّل التطبيق على الشاشة:</b> اضغط <b>⋮</b> بأعلى كروم واختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.<br><small>إذا فاتح من واتساب، اضغط ⋮ ← «فتح في Chrome» أول.</small></div>'}
function instGo(){if(!DP)return;DP.prompt();DP.userChoice.then(function(r){if(r&&r.outcome=="accepted"){SA=true;DP=null;instUI()}})}
function instUI(){var e=$("inst");if(e)e.innerHTML=instHTML()}
load();iosKeep();render();if(CFG.t)sync(1);setInterval(function(){if(!document.hidden)sync()},20000);document.addEventListener("visibilitychange",function(){if(!document.hidden)sync()});
</script>
</body>
