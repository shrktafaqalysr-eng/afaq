<script>

function tab(i){[0,1,2].forEach(function(k){document.getElementById("s"+k).classList.toggle("on",k==i);document.getElementById("t"+k).classList.toggle("on",k==i)});if(i==2)renderInv();if(i==1)renderList();window.scrollTo(0,0)}
function pw(){var w=window.open("","_blank");if(!w){alert("انسخ الرابط وافتحه بمتصفح كروم ثم جرب مرة ثانية");return}w.document.write('<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>فاتورة</title><style>body{font-family:sans-serif;padding:10px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #999;padding:6px;text-align:center}img{width:80px;height:60px;object-fit:contain}.noprint{display:none}.lgp{display:none}input{border:0;background:none;width:70px;text-align:center;font:inherit}.meta{display:flex;justify-content:space-between}</style></head><body>'+document.getElementById("inv").innerHTML+'<script>setTimeout(function(){window.print()},600)<\/script></body></html>');w.document.close()}
function msg(t){var e=document.getElementById("tst");e.textContent=t;e.style.display="block";setTimeout(function(){e.style.display="none"},3500)}
window.alert=msg;var lastCv=null;
function mkImg(){var rows=[],tot=0;all().forEach(function(p){var c=qty[p.id];if(c){rows.push([p,c]);tot+=c}});
 if(!rows.length){msg("اختر منتجات أول");return}
 var W=800,H=190+rows.length*110+70,cv=document.createElement("canvas");cv.width=W;cv.height=H;var x=cv.getContext("2d");
 x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#000";x.direction="rtl";x.textAlign="center";x.font="bold 36px sans-serif";x.fillText("شركة آفاق اليسر",W/2,50);
 x.font="20px sans-serif";x.fillText("للتجارة العامة لوازم و اكسسورات الستائر",W/2,82);
 x.textAlign="right";x.font="24px sans-serif";x.fillText("الزبون: "+document.getElementById("cust").value,W-20,130);
 x.textAlign="left";x.fillText(new Date().toLocaleDateString("ar-IQ")+(curNo?"  #"+curNo:""),20,130);
 x.strokeStyle="#999";x.beginPath();x.moveTo(10,150);x.lineTo(W-10,150);x.stroke();
 var done=0;rows.forEach(function(r,i){var p=r[0],c=r[1],y=160+i*110,im=new Image();
  im.onload=function(){var s=Math.min(130/im.width,95/im.height);x.drawImage(im,W-160+(130-im.width*s)/2,y+(95-im.height*s)/2,im.width*s,im.height*s);
   x.fillStyle="#000";x.textAlign="right";x.font="22px sans-serif";x.fillText(p.n,W-175,y+45,430);
   var ct=(p.ctn&&c>=p.ctn)?" ("+Math.floor(c/p.ctn)+" كارتونة"+(c%p.ctn?" + "+(c%p.ctn):"")+")":"";
   x.textAlign="left";x.font="bold 28px sans-serif";x.fillText(c+" "+(p.unit||""),20,y+40);x.font="16px sans-serif";x.fillText(ct,20,y+68);
   x.strokeStyle="#ccc";x.beginPath();x.moveTo(10,y+105);x.lineTo(W-10,y+105);x.stroke();
   if(++done==rows.length){x.fillStyle="#000";x.textAlign="center";x.font="bold 28px sans-serif";x.fillText("المجموع: "+tot+"  ("+rows.length+" صنف)",W/2,H-25);lastCv=cv;showOv(cv.toDataURL("image/png"))}};
  im.src=p.img})}
function showOv(u){var o=document.getElementById("ov");o.style.display="block";
 o.innerHTML='<img src="'+u+'" style="width:100%;background:#fff;border-radius:8px"><p style="color:#fff;font-size:14px">اضغط مطولاً على الصورة واختر <b>مشاركة</b> أو <b>حفظ</b>، وبعدها اطبعها من تطبيق الطابعة أو من المعرض.</p><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="shr()">مشاركة</button><button class="btn g" style="flex:1" onclick="document.getElementById(\'ov\').style.display=\'none\'">إغلاق</button></div>'}
function shr(){try{lastCv.toBlob(function(b){var f=new File([b],"invoice.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f]}).catch(function(){});else msg("اضغط مطولاً على الصورة واختر مشاركة أو حفظ")})}catch(e){msg("اضغط مطولاً على الصورة")}}
function renderGrid(){var s=document.getElementById("q").value.trim(),h="";
 all().forEach(function(p,i){if(s&&p.n.indexOf(s)<0)return;var c=qty[p.id]||0;
 h+='<div class="card'+(c?' sel':'')+'"><img src="'+p.img+'"><div class="n">'+p.n+(p.unit?' <small style="color:var(--mu)">· '+p.unit+'</small>':'')+'</div><div class="qty"><button onclick="ch(\''+p.id+'\',-1)">−</button><input type="number" inputmode="numeric" min="0" class="qi" value="'+c+'" onchange="setq(\''+p.id+'\',this.value)"><button onclick="ch(\''+p.id+'\',1)">+</button></div>'+(p.ctn?'<div class="qty" style="border-top:1px solid var(--ln)"><button onclick="ch(\''+p.id+'\',-1,'+p.ctn+')">−</button><span style="flex:1;min-width:0;font-size:10px;text-align:center">كارتونة ('+p.ctn+')<br><input type="number" inputmode="numeric" min="0" class="qi" value="'+Math.floor(c/p.ctn)+'" onchange="setc(\''+p.id+'\',this.value,'+p.ctn+')"></span><button onclick="ch(\''+p.id+'\',1,'+p.ctn+')">+</button></div>':'')+'</div>'});
 document.getElementById("grid").innerHTML=h||'<div class="empty">ماكو منتجات</div>'}
function ch(id,d,cs){var p=all().filter(function(x){return x.id==id})[0],st=cs||(p&&p.step)||1;qty[id]=Math.max(0,(qty[id]||0)+d*st);if(!qty[id])delete qty[id];renderGrid();upd()}
function fin(id,n,st){if(st>1)n=Math.ceil(n/st)*st;if(n>0)qty[id]=n;else delete qty[id];renderGrid();upd()}
function setq(id,v){var p=all().filter(function(x){return x.id==id})[0];fin(id,Math.max(0,parseInt(v)||0),(p&&p.step)||1)}
function setc(id,v,k){fin(id,Math.max(0,parseInt(v)||0)*k+((qty[id]||0)%k),1)}
function upd(){var k=Object.keys(qty),t=0;k.forEach(function(x){t+=qty[x]});
 document.getElementById("cnt").textContent=k.length;document.getElementById("sum").textContent=k.length+" صنف · "+t+" قطعة";
 document.getElementById("bar").style.display=k.length?"flex":"none"}
function renderInv(){var h="",t=0,n=0;
 all().forEach(function(p){var c=qty[p.id];if(!c)return;n++;t+=c;h+='<tr><td>'+n+'</td><td><img src="'+p.img+'"></td><td>'+p.n+'</td><td><b>'+c+(p.unit?' '+p.unit:'')+'</b>'+(p.ctn&&c>=p.ctn?'<br><small>('+Math.floor(c/p.ctn)+' كارتونة'+(c%p.ctn?' + '+(c%p.ctn)+' زوج':'')+')</small>':'')+'</td></tr>'});
 document.getElementById("invBody").innerHTML=n?'<table><tr><th>#</th><th>الشكل</th><th>الاسم</th><th>العدد</th></tr>'+h+'<tr><td colspan="3"><b>المجموع</b></td><td><b>'+t+'</b></td></tr></table>':'<div class="empty">لم يتم اختيار أي منتج</div>';
 document.getElementById("dt").textContent=new Date().toLocaleDateString("ar-IQ")}
function clearAll(){if(true){qty={};document.getElementById("cust").value="";cn.textContent="";renderGrid();renderInv();upd()}}
function renderList(){document.getElementById("pc").textContent=all().length;
 var h="";all().forEach(function(p){var u=mine.some(function(m){return m.id==p.id});
 h+='<div class="mi"><img src="'+p.img+'"><span>'+p.n+'</span>'+(u?'<button class="btn g" onclick="del(\''+p.id+'\')">حذف</button>':'')+'</div>'});
 document.getElementById("mlist").innerHTML=h}
function del(id){mine=mine.filter(function(m){return m.id!=id});delete qty[id];save();renderList();renderGrid();upd()}
function addProd(){var n=document.getElementById("nm").value.trim(),f=document.getElementById("fl").files[0];
 if(!n||!f){alert("اكتب الاسم واختر صورة");return}
 var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){
  var s=480,k=Math.min(1,s/Math.max(im.width,im.height)),c=document.createElement("canvas");
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);
  var st=parseInt(document.getElementById("stp").value)||1;mine.push({id:"u"+Date.now(),n:n,step:st>1?st:0,unit:st>1?"روطة":"",img:c.toDataURL("image/jpeg",0.7)});save();
  document.getElementById("nm").value="";document.getElementById("stp").value="";document.getElementById("fl").value="";renderList();renderGrid()};im.src=r.result};r.readAsDataURL(f)}
renderGrid();
</script>
<script>
var ovr={};try{ovr=JSON.parse(localStorage.getItem("afaq_ovr")||"{}")}catch(e){}
function all(){return SEED.map(function(p){return Object.assign({},p,ovr[p.id]||{})}).concat(mine)}

document.getElementById("s1").innerHTML=`<h3 id="ft">إضافة منتج</h3><input type="hidden" id="eid"><input type="text" id="cat" list="cats" placeholder="المادة الإجمالية (مثل: حبال، سفايف)"><datalist id="cats"></datalist><input type="text" id="nm" placeholder="اسم النوع (مثال: حبل عنقود عنب رصاصي)">

function rstF(){["eid","nm","cat","u1","u2","cf","p1","p2","stp","fl"].forEach(function(i){document.getElementById(i).value=""});document.getElementById("ft").textContent="إضافة منتج";var q=document.getElementById("pn");if(q)q.textContent=""}
function edt(id){var p=all().filter(function(x){return x.id==id})[0],s=function(i,v){document.getElementById(i).value=v||""};s("eid",id);s("nm",p.n);s("cat",p.cat);s("u1",p.unit);s("u2",p.u2);s("cf",p.ctn);s("p1",p.p1);s("p2",p.p2);s("stp",p.step);document.getElementById("ft").textContent="تعديل: "+p.n;window.scrollTo(0,0)}
function addProd(){var g=function(i){return document.getElementById(i).value.trim()},n=g("nm"),f=document.getElementById("fl").files[0],eid=g("eid");
 if(!n||(!f&&!eid)){msg("اكتب الاسم واختر صورة");return}
 var ctn=parseInt(g("cf"))||0,st=parseInt(g("stp"))||0,d={n:n,cat:g("cat"),unit:g("u1")||"زوج",u2:ctn>1?(g("u2")||"كارتونة"):"",ctn:ctn>1?ctn:0,step:st>1?st:0,p1:parseFloat(g("p1"))||0,p2:parseFloat(g("p2"))||0};
 var fin2=function(img){var m=mine.filter(function(x){return x.id==eid})[0];
  if(eid&&m){Object.assign(m,d);if(img)m.img=img}else if(eid){ovr[eid]=Object.assign({},ovr[eid]||{},d);if(img)ovr[eid].img=img}else mine.push(Object.assign({id:"u"+Date.now(),img:img},d));
